<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)">
<title>소크라테스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e7;
    --paper: #fffdf8;
    --ink: #2a2520;
    --soft: #6f665b;
    --faint: #a89f92;
    --line: #e4dccd;
    --you: #ebe3d3;
    --accent: #8a5a2b;
    --accent-ink: #fffaf2;
    --danger: #a23b2a;
    --serif: "Noto Serif KR", "AppleMyungjo", "Nanum Myeongjo", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1916;
      --paper: #24211d;
      --ink: #ece5d8;
      --soft: #b3a998;
      --faint: #7d7466;
      --line: #36312a;
      --you: #332e27;
      --accent: #d29a5f;
      --accent-ink: #1b1916;
      --danger: #e0806e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-text-size-adjust: 100%;
  }
  .app {
    max-width: 720px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  header {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; gap: 12px;
  }
  .title { flex: 1; min-width: 0; }
  .title h1 {
    margin: 0; font-family: var(--serif); font-weight: 600;
    font-size: 20px; letter-spacing: 0.02em;
  }
  .title p { margin: 2px 0 0; font-size: 12px; color: var(--soft); }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--paper);
    color: var(--ink); font: inherit; font-size: 14px;
    padding: 8px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--faint); }
  .btn:focus-visible, textarea:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { flex: 1; padding: 20px 16px 8px; }
  .turn { margin: 0 0 22px; }
  .who { font-size: 12px; color: var(--soft); margin-bottom: 6px; letter-spacing: 0.04em; }
  .socrates .text {
    font-family: var(--serif); font-size: 18px; line-height: 1.85;
    white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere;
  }
  .you { display: flex; flex-direction: column; align-items: flex-end; }
  .you .text {
    background: var(--you); border-radius: 18px 18px 4px 18px;
    padding: 10px 14px; max-width: 85%;
    font-size: 16px; line-height: 1.65; white-space: pre-wrap;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  .thinking { color: var(--faint); font-family: var(--serif); font-size: 16px; }
  .thinking span { animation: blink 1.4s infinite both; }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  .note { font-size: 14px; color: var(--danger); margin: -8px 0 18px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 22px; }
  .chip {
    appearance: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 999px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }

  footer {
    position: sticky; bottom: 0;
    background: color-mix(in srgb, var(--bg) 94%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 22px;
    padding: 6px 6px 6px 14px;
  }
  textarea {
    flex: 1; border: 0; outline: none; resize: none; background: transparent; color: var(--ink);
    font: inherit; font-size: 16px; line-height: 1.5; padding: 7px 0; max-height: 40vh;
  }
  textarea::placeholder { color: var(--faint); }
  .send {
    appearance: none; border: 0; background: var(--accent); color: var(--accent-ink);
    width: 38px; height: 38px; border-radius: 50%; cursor: pointer; flex: none;
    display: grid; place-items: center;
  }
  .send:disabled { opacity: 0.35; cursor: default; }
  .hint { font-size: 12px; color: var(--faint); margin: 6px 4px 0; }

  /* 지난 문답 */
  .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 20; display: none; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 88vw); z-index: 21;
    background: var(--paper); border-left: 1px solid var(--line);
    padding: calc(16px + env(safe-area-inset-top)) 16px 16px; overflow-y: auto;
    transform: translateX(100%); transition: transform 0.2s ease;
  }
  .open .drawer-bg { display: block; }
  .open .drawer { transform: none; }
  .drawer h2 { font-family: var(--serif); font-size: 18px; margin: 0 0 12px; }
  .past { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
    background: none; color: var(--ink); font: inherit; padding: 12px 2px; cursor: pointer; }
  .past small { display: block; color: var(--soft); font-size: 12px; margin-top: 3px; }
  .past.now { color: var(--accent); }
  .empty { color: var(--soft); font-size: 14px; }

  /* 문 */
  .door { max-width: 360px; margin: 18vh auto 0; padding: 0 16px; text-align: center; }
  .door h1 { font-family: var(--serif); font-weight: 600; }
  .door p { color: var(--soft); }
  .door input {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink); margin: 8px 0;
  }
  .door .btn { width: 100%; padding: 12px; background: var(--accent); color: var(--accent-ink); border: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="door" id="door" hidden>
  <h1>소크라테스</h1>
  <p>들어오려면 비밀번호를 말해 주게.</p>
  <form id="doorForm">
    <input id="doorPw" type="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호">
    <button class="btn" type="submit">들어가기</button>
    <p class="note" id="doorNote" hidden></p>
  </form>
</div>

<div class="app" id="app" hidden>
  <header>
    <div class="title">
      <h1>소크라테스</h1>
      <p>검토하지 않은 삶은 살 가치가 없다</p>
    </div>
    <button class="btn" id="pastBtn" type="button">지난 문답</button>
    <button class="btn" id="newBtn" type="button">새 문답</button>
  </header>

  <main id="log" aria-live="polite"></main>

  <footer>
    <form class="composer" id="form">
      <textarea id="input" rows="1" placeholder="자네 생각을 말해 주게" aria-label="할 말"></textarea>
      <button class="send" id="send" type="submit" aria-label="보내기" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <p class="hint">아이폰에서는 키보드의 마이크를 눌러 말로 해도 된다.</p>
  </footer>
</div>

<div id="drawerWrap">
  <div class="drawer-bg" id="drawerBg"></div>
  <aside class="drawer" aria-label="지난 문답">
    <h2>지난 문답</h2>
    <div id="pastList"></div>
  </aside>
</div>

<script>
(() => {
  const GREETING = "어서 오게. 나는 아는 것이 없는 사람일세. 그래서 묻는 것밖에 할 줄 모르지.\n\n오늘은 무엇에 대해 이야기해 볼까? 자네가 옳다고 믿는 것 하나를 말해 주어도 좋고, 요즘 마음에 걸리는 물음 하나를 꺼내도 좋네.";
  const TOPICS = [
    "용기란 무엇일까?",
    "좋은 삶이란 무엇일까?",
    "인정받는다는 것은 무엇일까?",
    "기억이란 무엇일까?",
    "AI도 생각할 수 있을까?",
  ];

  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), send = $("send"), form = $("form");

  // ── 이 브라우저에만 남는 것(지난 문답 목록) ──
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const newId = () => {
    const a = new Uint8Array(12);
    crypto.getRandomValues(a);
    return Array.from(a, (b) => b.toString(16).padStart(2, "0")).join("");
  };

  let convId = store.get("socrates.current", null) || newId();
  let busy = false;

  function remember(title) {
    const list = store.get("socrates.list", []);
    const i = list.findIndex((c) => c.id === convId);
    const now = new Date().toISOString();
    if (i >= 0) { list[i].updated = now; }
    else { list.unshift({ id: convId, title: title.slice(0, 40), updated: now }); }
    list.sort((a, b) => (b.updated > a.updated ? 1 : -1));
    store.set("socrates.list", list.slice(0, 100));
    store.set("socrates.current", convId);
  }

  // ── 그리기 ──
  function addTurn(role, text) {
    const div = document.createElement("div");
    div.className = "turn " + (role === "user" ? "you" : "socrates");
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = role === "user" ? "나" : "소크라테스";
    const t = document.createElement("div");
    t.className = "text";
    t.textContent = text;
    div.append(who, t);
    log.append(div);
    return { div, t };
  }

  function addChips() {
    const wrap = document.createElement("div");
    wrap.className = "chips";
    wrap.id = "chips";
    for (const topic of TOPICS) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = topic;
      b.onclick = () => talk(topic);
      wrap.append(b);
    }
    log.append(wrap);
  }

  function note(msg) {
    const p = document.createElement("p");
    p.className = "note";
    p.textContent = msg;
    log.append(p);
    scrollDown();
  }

  function scrollDown() {
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  function render(view) {
    log.innerHTML = "";
    addTurn("assistant", GREETING);
    if (!view.length) addChips();
    for (const m of view) addTurn(m.role, m.text);
    window.scrollTo({ top: document.body.scrollHeight });
  }

  async function loadConversation() {
    try {
      const r = await fetch("/api/conversations/" + encodeURIComponent(convId));
      if (r.status === 401) return showDoor();
      const j = await r.json();
      render(j.view || []);
    } catch {
      render([]);
    }
  }

  // ── 말하기 ──
  async function talk(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true;
    updateSend();
    $("chips")?.remove();
    log.querySelectorAll(".note").forEach((n) => n.remove());

    const mine = addTurn("user", text);
    input.value = "";
    autoGrow();

    const his = addTurn("assistant", "");
    his.t.innerHTML = '<span class="thinking"><span>·</span><span>·</span><span>·</span></span>';
    scrollDown();

    let got = "";
    let failed = null;
    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: convId, text }),
      });
      if (r.status === 401) { showDoor(); return; }
      if (!r.ok || !r.body) {
        const j = await r.json().catch(() => ({}));
        throw new Error(j.error || "말이 전해지지 않았네.");
      }
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, nl);
          buf = buf.slice(nl + 1);
          if (!line.trim()) continue;
          const ev = JSON.parse(line);
          if (ev.type === "text") {
            got += ev.text;
            his.t.textContent = got;
          } else if (ev.type === "error") {
            failed = ev.message;
          }
        }
      }
      if (!failed && !got) failed = "대답이 비어 있네. 다시 말해 주겠나?";
    } catch (e) {
      failed = e.message || "말이 전해지지 않았네.";
    }

    if (failed) {
      his.div.remove();
      mine.div.remove();
      input.value = text;
      autoGrow();
      note(failed);
      if (!log.querySelector(".you")) addChips();
    } else {
      remember(text);
    }
    busy = false;
    updateSend();
    scrollDown();
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); talk(input.value); });
  input.addEventListener("keydown", (e) => {
    // 한글 입력 중(조합 중)의 Enter 는 보내지 않는다.
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229 && !matchMedia("(pointer: coarse)").matches) {
      e.preventDefault();
      talk(input.value);
    }
  });
  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + "px";
    updateSend();
  }
  function updateSend() { send.disabled = busy || !input.value.trim(); }
  input.addEventListener("input", autoGrow);

  // ── 새 문답 · 지난 문답 ──
  $("newBtn").onclick = () => {
    if (busy) return;
    convId = newId();
    store.set("socrates.current", convId);
    render([]);
    input.focus();
  };

  const wrap = $("drawerWrap");
  $("pastBtn").onclick = () => {
    const list = store.get("socrates.list", []);
    const box = $("pastList");
    box.innerHTML = "";
    if (!list.length) {
      box.innerHTML = '<p class="empty">아직 지난 문답이 없네.</p>';
    }
    for (const c of list) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "past" + (c.id === convId ? " now" : "");
      b.textContent = c.title;
      const s = document.createElement("small");
      s.textContent = new Date(c.updated).toLocaleString("ko-KR", { month: "long", day: "numeric", hour: "numeric", minute: "2-digit" });
      b.append(s);
      b.onclick = () => {
        if (busy) return;
        convId = c.id;
        store.set("socrates.current", convId);
        wrap.classList.remove("open");
        loadConversation();
      };
      box.append(b);
    }
    wrap.classList.add("open");
  };
  $("drawerBg").onclick = () => wrap.classList.remove("open");

  // ── 문 ──
  function showDoor() {
    $("app").hidden = true;
    $("door").hidden = false;
    $("doorPw").focus();
  }
  $("doorForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const r = await fetch("/api/door", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("doorPw").value }),
    });
    if (r.ok) { $("door").hidden = true; start(); }
    else { const n = $("doorNote"); n.textContent = "비밀번호가 맞지 않네."; n.hidden = false; }
  });

  async function start() {
    try {
      const r = await fetch("/api/door");
      const j = await r.json();
      if (!j.open) return showDoor();
    } catch {}
    $("app").hidden = false;
    await loadConversation();
  }
  start();
})();
</script>
</body>
</html>
