<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>소크라테스 · 원장님</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e7; --paper: #fffdf8; --ink: #2a2520; --soft: #6f665b; --faint: #a89f92; --line: #e4dccd;
    --you: #ebe3d3; --accent: #8a5a2b; --accent-ink: #fffaf2; --danger: #a23b2a; --ok: #4f6b3a;
    --add: #e3efd8; --del: #f6dcd6;
    --serif: "Noto Serif KR", "AppleMyungjo", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1916; --paper: #24211d; --ink: #ece5d8; --soft: #b3a998; --faint: #7d7466; --line: #36312a;
      --you: #332e27; --accent: #d29a5f; --accent-ink: #1b1916; --danger: #e0806e; --ok: #a5c38d; --add: #2b3a22; --del: #47261f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 820px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px 60px; }
  h1 { font-family: var(--serif); font-size: 22px; margin: 0 0 4px; }
  h2 { font-family: var(--serif); font-size: 18px; margin: 28px 0 10px; }
  .sub { color: var(--soft); font-size: 13px; margin: 0 0 16px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .meta { font-size: 12px; color: var(--soft); }
  .body { white-space: pre-wrap; line-height: 1.7; margin: 8px 0; word-break: keep-all; overflow-wrap: anywhere; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .btn { appearance: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  input, textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; }
  textarea.mind { min-height: 360px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.6; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--soft); }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--you); color: var(--soft); margin-left: 6px; }
  .tag.open { background: var(--accent); color: var(--accent-ink); }
  .diff { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--line); border-radius: 10px; padding: 8px; max-height: 360px; overflow-y: auto; }
  .diff .a { background: var(--add); }
  .diff .d { background: var(--del); text-decoration: line-through; }
  .diff .s { color: var(--faint); }
  .warn { color: var(--danger); font-size: 14px; }
  .ok { color: var(--ok); font-size: 14px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 14px; margin-top: 6px; }
  .turn { margin: 8px 0; font-size: 14px; line-height: 1.65; white-space: pre-wrap; }
  .turn b { color: var(--soft); font-weight: 600; margin-right: 6px; }
  .empty { color: var(--soft); font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>소크라테스 · 원장님</h1>
  <p class="sub">사람들의 제안을 읽고, 받아들일 것을 골라 소크라테스의 마음을 새 판으로 바꿉니다. <a href="/" style="color:var(--accent)">문답 페이지로</a></p>

  <form id="login" class="card" hidden>
    <p>원장님 비밀번호</p>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="row"><button class="btn primary">들어가기</button><span id="loginMsg" class="warn"></span></div>
  </form>

  <div id="main" hidden>
    <div class="stats" id="stats"></div>

    <h2>제안</h2>
    <div id="proposals"></div>

    <h2>문답집에 올려 달라는 문답</h2>
    <div id="book"></div>

    <h2>답마다 남긴 한마디</h2>
    <div id="feedback"></div>

    <h2>마음 직접 고치기 <span class="meta" id="mindNow"></span></h2>
    <div class="card">
      <textarea class="mind" id="mindEdit"></textarea>
      <input id="mindNote" placeholder="무엇을 왜 고쳤는지 한 줄 (마음의 역사에 남습니다)" style="margin-top:8px">
      <div class="row"><button class="btn primary" id="mindSave">새 판으로 저장</button><span id="mindMsg"></span></div>
    </div>

    <h2>마음의 역사</h2>
    <div id="versions"></div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (s) => new Date(s).toLocaleString("ko-KR", { month: "long", day: "numeric", hour: "numeric", minute: "2-digit" });
  let state = null;

  async function api(path, body) {
    const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { showLogin(j.login); throw new Error(j.error); }
    if (!r.ok) throw new Error(j.error || "문제가 생겼습니다.");
    return j;
  }
  function showLogin(canLogin) {
    $("main").hidden = true;
    $("login").hidden = false;
    if (!canLogin) $("login").innerHTML = '<p class="warn">원장님 페이지는 서버가 도는 컴퓨터에서만 열립니다.</p>';
  }
  $("login").onsubmit = async (e) => {
    e.preventDefault();
    try { await api("/api/admin/login", { password: $("pw").value }); $("login").hidden = true; load(); }
    catch (err) { $("loginMsg").textContent = err.message; }
  };

  // 줄 단위 비교(LCS) — 무엇이 빠지고 더해지는지 보이게
  function diff(a, b) {
    const A = a.split("\n"), B = b.split("\n");
    const n = A.length, m = B.length;
    const L = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const out = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (A[i] === B[j]) { out.push(["s", A[i]]); i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) out.push(["d", A[i++]]);
      else out.push(["a", B[j++]]);
    }
    while (i < n) out.push(["d", A[i++]]);
    while (j < m) out.push(["a", B[j++]]);
    // 바뀐 곳 둘레 두 줄만 남기고 같은 줄은 접는다
    const keep = out.map((x, k) => x[0] !== "s" || out.slice(Math.max(0, k - 2), k + 3).some((y) => y[0] !== "s"));
    let html = "", skipped = false;
    out.forEach((x, k) => {
      if (!keep[k]) { if (!skipped) html += '<div class="s">…</div>'; skipped = true; return; }
      skipped = false;
      html += `<div class="${x[0]}">${x[0] === "a" ? "+ " : x[0] === "d" ? "− " : "  "}${esc(x[1]) || " "}</div>`;
    });
    return out.some((x) => x[0] !== "s") ? html : '<div class="s">바뀐 곳이 없습니다.</div>';
  }

  function renderStats(s) {
    const usd = (u) => ((u.in || 0) * 4 + (u.out || 0) * 20 + (u.cache_read || 0) * 0.2 + (u.cache_write || 0) * 5) / 1e6;
    $("stats").innerHTML = [
      ["오늘 답", s.today.answers],
      ["오늘 쓴 돈(대략)", "$" + usd(s.today).toFixed(2)],
      ["모든 답", s.all.answers],
      ["모두 쓴 돈(대략)", "$" + usd(s.all).toFixed(2)],
      ["문답 수", s.conversations],
    ].map(([k, v]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("");
  }

  function renderProposals() {
    const box = $("proposals");
    const list = [...state.proposals].sort((a, b) => (a.status === "열림") === (b.status === "열림") ? 0 : a.status === "열림" ? -1 : 1);
    box.innerHTML = list.length ? "" : '<p class="empty">아직 제안이 없습니다.</p>';
    for (const p of list) {
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML = `<div class="meta">${esc(p.name)} · ${esc(fmt(p.at))} · 판 ${p.mind} 을 보고<span class="tag ${p.status === "열림" ? "open" : ""}">${esc(p.status)}${p.v ? " → 판 " + p.v : ""}</span></div>
        <div class="body">${esc(p.text)}</div>${p.reply ? `<div class="meta">원장님 답: ${esc(p.reply)}</div>` : ""}`;
      if (p.status === "열림") {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = '<button class="btn primary" data-a="draft">마음에 넣어 보기</button><button class="btn" data-a="decline">받아들이지 않기</button><span class="meta"></span>';
        const msg = row.querySelector("span");
        row.querySelector('[data-a="draft"]').onclick = async (e) => {
          e.target.disabled = true; msg.textContent = "소크라테스의 마음에 넣은 초안을 쓰는 중… (30초쯤)";
          try { const d = await api(`/api/admin/proposals/${p.id}/draft`, {}); msg.textContent = ""; showDraft(c, p, d); }
          catch (err) { msg.textContent = err.message; e.target.disabled = false; }
        };
        row.querySelector('[data-a="decline"]').onclick = async () => {
          const reply = prompt("제안한 사람에게 남길 말 (안 써도 됩니다)") ?? null;
          if (reply === null) return;
          await api(`/api/admin/proposals/${p.id}/decline`, { reply });
          load();
        };
        c.append(row);
      }
      box.append(c);
    }
  }

  function showDraft(card, p, d) {
    card.querySelector(".draft")?.remove();
    const w = document.createElement("div");
    w.className = "draft";
    w.innerHTML = `<p class="${d.fits ? "ok" : "warn"}">${d.fits ? "소크라테스의 목적과 맞습니다." : "소크라테스의 목적과 어긋나는 데가 있습니다."} ${esc(d.note)}</p>
      <div class="meta">바뀌는 곳 (판 ${d.base} → 새 판)</div><div class="diff"></div>
      <details><summary>새 판 전체를 보고 고치기</summary><textarea class="mind"></textarea></details>
      <input class="note" placeholder="마음의 역사에 남길 한 줄" style="margin-top:8px">
      <input class="reply" placeholder="제안한 사람에게 남길 말 (안 써도 됩니다)" style="margin-top:8px">
      <div class="row"><button class="btn primary">새 판으로 받아들이기</button><span class="meta"></span></div>`;
    const ta = w.querySelector("textarea");
    ta.value = d.text;
    const paint = () => { w.querySelector(".diff").innerHTML = diff(state.mind.text.trimEnd(), ta.value.trimEnd()); };
    ta.oninput = paint; paint();
    w.querySelector(".note").value = d.note.slice(0, 200);
    w.querySelector(".btn").onclick = async (e) => {
      e.target.disabled = true;
      try {
        const r = await api("/api/admin/mind", { text: ta.value, note: w.querySelector(".note").value, reply: w.querySelector(".reply").value, proposal: p.id, base: d.base });
        w.querySelector(".row span").textContent = `판 ${r.v} 이 되었습니다.`;
        setTimeout(load, 800);
      } catch (err) { w.querySelector(".row span").textContent = err.message; e.target.disabled = false; }
    };
    card.append(w);
  }

  function renderBook() {
    const box = $("book");
    const list = state.book;
    box.innerHTML = list.length ? "" : '<p class="empty">아직 없습니다.</p>';
    for (const b of list) {
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML = `<div class="meta">${esc(b.name)} · ${esc(fmt(b.at))} · 말 ${b.turns}번<span class="tag ${b.status === "기다림" ? "open" : ""}">${esc(b.status)}</span></div>
        <div class="body"><b>${esc(b.title)}</b>${b.note ? "\n" + esc(b.note) : ""}</div>
        <details><summary>문답 읽기</summary>${b.view.map((m) => `<div class="turn"><b>${m.role === "user" ? "사람" : "소크라테스"}</b>${esc(m.text)}</div>`).join("")}</details>
        <div class="row"><button class="btn primary" data-s="올림">문답집에 싣기</button><button class="btn" data-s="안올림">싣지 않기</button></div>`;
      c.querySelectorAll("[data-s]").forEach((btn) => btn.onclick = async () => { await api(`/api/admin/book/${b.id}`, { status: btn.dataset.s }); load(); });
      box.append(c);
    }
  }

  function renderFeedback() {
    const box = $("feedback");
    box.innerHTML = state.feedback.length ? "" : '<p class="empty">아직 없습니다.</p>';
    for (const f of state.feedback.slice(0, 60)) {
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML = `<div class="meta">${esc(fmt(f.at))} · 판 ${f.mind ?? "?"} <span class="tag ${f.verdict === "아님" ? "open" : ""}">${f.verdict === "좋음" ? "소크라테스다웠다" : "아니었다"}</span></div>
        ${f.text ? `<div class="body">${esc(f.text)}</div>` : ""}
        <details><summary>무슨 말에 대한 한마디인가</summary><div class="turn"><b>사람</b>${esc(f.asked)}</div><div class="turn"><b>소크라테스</b>${esc(f.answered)}</div></details>`;
      box.append(c);
    }
  }

  function renderVersions() {
    $("versions").innerHTML = [...state.versions].reverse().map((v) =>
      `<div class="card"><div class="meta">판 ${v.v} · ${esc(fmt(v.at))} · ${esc(v.by || "")}${v.acceptedBy ? " · " + esc(v.acceptedBy) + "이 받아들임" : ""}</div><div class="body">${esc(v.note || "")}</div></div>`).join("");
  }

  $("mindSave").onclick = async (e) => {
    e.target.disabled = true;
    try {
      const r = await api("/api/admin/mind", { text: $("mindEdit").value, note: $("mindNote").value || "원장님이 직접 고침", base: state.mind.v });
      $("mindMsg").textContent = `판 ${r.v} 이 되었습니다.`;
      $("mindNote").value = "";
      load();
    } catch (err) { $("mindMsg").textContent = err.message; }
    e.target.disabled = false;
  };

  async function load() {
    try { state = await api("/api/admin/state"); } catch { return; }
    $("main").hidden = false;
    renderStats(state.stats);
    renderProposals();
    renderBook();
    renderFeedback();
    renderVersions();
    $("mindNow").textContent = `지금 판 ${state.mind.v}`;
    $("mindEdit").value = state.mind.text;
  }
  load();
})();
</script>
</body>
</html>
